<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Circuit Comfort</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="phone">
    <main class="page landing-page">
      <div class="glow-bg"></div>
      <div class="s1-top">
        <div class="s1-logo icon-logo"></div>
        <div class="s1-brand">Circuit Comfort</div>
      </div>

      <section class="hero">
        <h1>VIU EL<br>CIRCUIT<br><span>SENSE</span><br>ESTRÉS</h1>
        <p>Mapa interactiu en temps real, alertes de calor, millors rutes i menjar sense cua al Circuit de Barcelona-Catalunya.</p>
      </section>

      <section class="cta">
        <button class="btn-primary" data-page="login">COMENÇA ARA →</button>
        <p>Ja tens compte? <strong data-page="login">Inicia sessió</strong></p>
      </section>

      <section class="chips">
        <div class="chip"><span class="dot"></span> En directe</div>
        <div class="chip">🌡️ Alertes calor</div>
        <div class="chip">🍕 Menjar proper</div>
      </section>
    </main>
  </div>

  <script src="index.js"></script>
</body>
</html>
